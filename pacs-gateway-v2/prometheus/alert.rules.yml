groups:
  - name: pacs_alerts
    rules:
      - alert: RcloneServiceDown
        expr: up{job="rclone"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rclone RC servisi çöktü!"
          description: "RC API yanıt vermiyor. Metrik/monitoring erişimi kesildi."

      - alert: SambaServiceDown
        expr: up{job="samba"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Samba servisi çalışmıyor!"
          description: "Windows client'lar (Fuji/doktorlar) paylaşıma erişemiyor."

      - alert: HotStorageDiskSpaceWarning
        expr: (node_filesystem_avail_bytes{mountpoint="/mnt/pacs-hot"} / node_filesystem_size_bytes{mountpoint="/mnt/pacs-hot"} * 100) < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hot disk %80 dolu (uyarı)"
          description: "Staging alanı (PACS_Local) doluyor. Upload/cleanup akışını kontrol edin."

      - alert: HotStorageDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/mnt/pacs-hot"} / node_filesystem_size_bytes{mountpoint="/mnt/pacs-hot"} * 100) < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hot disk %90 dolu!"
          description: "Disk alanı kritik seviyede. cleanup-old.sh çalışıyor mu ve upload-watcher OBS'e yükleyebiliyor mu kontrol edin."

      - alert: RcloneBufferUsageHigh
        expr: rclone_vfs_disk_cache_bytes / (1024*1024*1024) > 45
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Read-only mount VFS cache %85+ dolu"
          description: "archive-ro mount'un cache boyutu (50G limit) sınırına yaklaşıyor. LRU eskileri otomatik atacaktır, performans düşebilir."
