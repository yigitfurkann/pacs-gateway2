[global]
   server min protocol = SMB2
   server max protocol = SMB3
   client min protocol = SMB2
   client max protocol = SMB3
   workgroup = PACS
   interfaces = 0.0.0.0/0
   bind interfaces only = no

# Fuji/PACS buraya YAZAR. Gerçek yerel disk (mount değil, staging alanı).
# upload-watcher.sh bu dizini izleyip OBS'e gönderir.
[PACS_Local]
   path = /mnt/pacs-hot/local
   browseable = yes
   read only = no
   guest ok = no
   valid users = pacsuser
   force user = pacsuser
   force group = pacsuser
   create mask = 0666
   directory mask = 0777

# Doktorlar buradan OKUR. rclone read-only cache-first mount, OBS'e bağlı.
[PACS_Archive]
   path = /mnt/pacs-hot/archive-ro
   browseable = yes
   read only = yes
   guest ok = no
   valid users = pacsuser
   force user = pacsuser
   force group = pacsuser
